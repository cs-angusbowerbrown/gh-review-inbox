<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review inbox</title>
<link rel="icon" id="favicon" href="">
<style>
  :root {
    --bg: #ffffff; --canvas: #f6f8fa; --fg: #1f2328; --muted: #59636e; --border: #d1d9e0;
    --row-hover: #f6f8fa; --accent: #0969da; --green: #1a7f37; --red: #d1242f; --amber: #9a6700;
    --purple: #8250df; --badge-bg: #ddf4ff; --badge-fg: #0969da; --match: #fff8c5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --canvas: #010409; --fg: #f0f6fc; --muted: #9198a1; --border: #3d444d;
      --row-hover: #151b23; --accent: #4493f8; --green: #3fb950; --red: #f85149; --amber: #d29922;
      --purple: #ab7df8; --badge-bg: #121d2f; --badge-fg: #4493f8; --match: #5c4813;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--canvas); color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  }
  main { max-width: 1012px; margin: 0 auto; padding: 24px 16px 72px; }
  #keybar {
    position: fixed; inset: auto 0 0; background: var(--bg); border-top: 1px solid var(--border);
    color: var(--muted); font-size: 12px;
  }
  #keybar ul {
    list-style: none; max-width: 1012px; margin: 0 auto; padding: 8px 16px;
    display: flex; flex-wrap: wrap; gap: 4px 16px;
  }
  #keybar li { display: flex; align-items: center; gap: 6px; }
  #keybar li:last-child { margin-left: auto; }
  @media (hover: none), (max-width: 640px) {
    #keybar { display: none; }
    main { padding-bottom: 48px; }
  }
  .toggle kbd { margin-left: 4px; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  .status { color: var(--muted); font-size: 12px; margin-left: auto; }
  button {
    font: inherit; font-size: 12px; font-weight: 500; color: var(--fg); background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; padding: 3px 12px; cursor: pointer;
  }
  button:hover { background: var(--row-hover); }
  button:disabled { opacity: .6; cursor: default; }
  section { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 16px; overflow: hidden; }
  section > h2 {
    margin: 0; padding: 12px 16px; font-size: 14px; font-weight: 600; background: var(--canvas);
    border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px;
  }
  .count { font-size: 12px; font-weight: 500; background: var(--border); border-radius: 2em; padding: 0 7px; }
  .bar { display: flex; align-items: end; gap: 8px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  nav { display: flex; gap: 8px; flex: 1; }
  #filter {
    font: inherit; font-size: 12px; color: var(--fg); background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 8px; margin-bottom: 6px; flex: 0 1 240px; min-width: 0;
  }
  #filter:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  mark { background: var(--match); color: inherit; border-radius: 2px; }
  nav a {
    padding: 8px 12px; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px;
    display: flex; align-items: center; gap: 8px;
  }
  nav a:hover { color: var(--fg); }
  nav a[aria-current] { color: var(--fg); font-weight: 600; border-bottom-color: #fd8c73; }
  kbd { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
  .hint { color: var(--muted); font-weight: 400; font-size: 12px; }
  section > h2 .toggle { margin-left: auto; font-weight: 400; color: var(--muted); }
  section > h2 .toggle:hover { color: var(--accent); }
  section.quiet .title { font-weight: 500; color: var(--muted); }
  .empty { padding: 16px; color: var(--muted); }
  a.row {
    display: grid; grid-template-columns: 16px 1fr auto; gap: 4px 10px; align-items: start;
    padding: 10px 16px; color: inherit; text-decoration: none; border-top: 1px solid var(--border);
  }
  a.row:first-of-type { border-top: 0; }
  a.row:hover { background: var(--row-hover); }
  a.row:hover .title { color: var(--accent); }
  a.row.selected { background: var(--row-hover); box-shadow: inset 2px 0 0 var(--accent); }
  dialog {
    background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 20px; max-width: calc(100vw - 32px);
  }
  dialog::backdrop { background: rgb(1 4 9 / .5); }
  dialog h2 { font-size: 14px; margin: 0 0 12px; }
  dialog dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0 0 16px; }
  dialog dt { white-space: nowrap; color: var(--muted); }
  dialog dd { margin: 0; }
  dialog form { text-align: right; }
  .icon { margin-top: 3px; }
  .title { font-weight: 600; overflow-wrap: anywhere; }
  .meta { grid-column: 2; color: var(--muted); font-size: 12px; }
  .side { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .badge { background: var(--badge-bg); color: var(--badge-fg); border-radius: 2em; padding: 0 8px; font-weight: 500; }
  .label { border: 1px solid var(--border); border-radius: 2em; padding: 0 7px; }
  .approved { color: var(--green); border-color: var(--green); }
  .changes { color: var(--red); border-color: var(--red); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .SUCCESS { background: var(--green); } .FAILURE, .ERROR { background: var(--red); }
  .PENDING, .EXPECTED { background: var(--amber); }
  .add { color: var(--green); } .del { color: var(--red); }
  .error { background: var(--bg); border: 1px solid var(--red); color: var(--red); border-radius: 6px; padding: 12px 16px; margin-bottom: 16px; white-space: pre-wrap; }
  .status { display: flex; align-items: center; gap: 6px; }
  .spinner {
    width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--border); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .skeleton { display: grid; grid-template-columns: 16px 1fr; gap: 8px 10px; padding: 12px 16px; border-top: 1px solid var(--border); }
  .skeleton:first-of-type { border-top: 0; }
  .bone {
    height: 10px; border-radius: 5px; grid-column: 2;
    background: linear-gradient(100deg, var(--row-hover) 30%, var(--border) 50%, var(--row-hover) 70%) var(--row-hover);
    background-size: 300% 100%; animation: shimmer 1.6s ease-in-out infinite; animation-delay: var(--delay);
  }
  .bone.dot { grid-column: 1; grid-row: 1; width: 14px; height: 14px; border-radius: 50%; margin-top: -2px; }
  .bone.meta { height: 8px; opacity: .7; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
  @media (prefers-reduced-motion: reduce) {
    .spinner, .bone { animation: none; }
  }
  @media (max-width: 640px) {
    a.row { grid-template-columns: 16px 1fr; }
    .side { grid-column: 2; flex-wrap: wrap; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Review inbox</h1>
    <span class="status" id="status"></span>
    <button id="refresh">Refresh</button>
    <button id="shortcuts" aria-label="Keyboard shortcuts" title="Keyboard shortcuts">?</button>
  </header>
  <div class="bar">
    <nav id="tabs"></nav>
    <input id="filter" type="search" placeholder="Filter (/)" title="Filter by title, repo, #number or author" aria-label="Filter" autocomplete="off">
  </div>
  <dialog id="help">
    <h2>Keyboard shortcuts</h2>
    <dl id="keys"></dl>
    <form method="dialog"><button>Close</button></form>
  </dialog>
  <footer id="keybar" aria-label="Keyboard shortcuts"><ul></ul></footer>
  <div id="error"></div>
  <div id="groups"></div>
</main>
<script>
  const PAGES = [
    {
      id: "reviewing", title: "Reviewing",
      optional: { id: "approved", key: "a", noun: "approved by you", notice: "reviewed" },
      groups: [
        { id: "pending", title: "Pending reviews", hint: "Reviews you've started but not submitted", link: "files" },
        { id: "requested", title: "Requested from you", hint: "Not started yet", link: "files" },
        { id: "reviewed", title: "Reviewed, still open", hint: "You've reviewed but not approved", link: "files" },
        { id: "approved", title: "Approved by you", hint: "Still open", link: "files", quiet: true, decided: true },
      ],
    },
    {
      id: "yours", title: "Yours",
      optional: { id: "mineDraft", key: "d", noun: "drafts", notice: "mineWaiting" },
      groups: [
        { id: "mineDraft", title: "Draft", hint: "Not ready for review", link: "", mine: true },
        { id: "mineWaiting", title: "Waiting for review", hint: "No reviews yet", link: "", mine: true },
        { id: "mineInReview", title: "In review", hint: "Reviews in, not approved", link: "", mine: true },
        { id: "mineApproved", title: "Approved", hint: "Ready to merge", link: "", mine: true, decided: true },
      ],
    },
  ];

  const pageIndex = () => Math.max(0, PAGES.findIndex((p) => `#${p.id}` === location.hash));
  const defaultGroups = (page) => page.groups.filter((g) => g.id !== page.optional.id);
  const pageCount = (data, page) => defaultGroups(page).reduce((sum, g) => sum + data.groups[g.id].length, 0);

  const OPEN_ICON = '<svg class="icon" width="16" height="16" viewBox="0 0 16 16" fill="var(--green)"><path d="M1.5 3.25a2.25 2.25 0 1 1 3 2.122v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.25 2.25 0 0 1 1.5 3.25Zm5.677-.177L9.573.677A.25.25 0 0 1 10 .854V2.5h1A2.5 2.5 0 0 1 13.5 5v5.628a2.251 2.251 0 1 1-1.5 0V5a1 1 0 0 0-1-1h-1v1.646a.25.25 0 0 1-.427.177L7.177 3.427a.25.25 0 0 1 0-.354ZM3.75 2.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm0 9.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm8.25.75a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0Z"/></svg>';
  const DRAFT_ICON = '<svg class="icon" width="16" height="16" viewBox="0 0 16 16" fill="var(--muted)"><path d="M3.25 1A2.25 2.25 0 0 1 4 5.372v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.251 2.251 0 0 1 3.25 1Zm9.5 14a2.25 2.25 0 1 1 0-4.5 2.25 2.25 0 0 1 0 4.5ZM2.5 3.25a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0ZM3.25 12a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm9.5 0a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5ZM14 7.5a1.25 1.25 0 1 1-2.5 0 1.25 1.25 0 0 1 2.5 0Zm0-4.25a1.25 1.25 0 1 1-2.5 0 1.25 1.25 0 0 1 2.5 0Z"/></svg>';

  function favicon() {
    const mark = '<path fill-rule="evenodd" d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/>';
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><style>path{fill:#1f2328}@media (prefers-color-scheme:dark){path{fill:#f0f6fc}}</style>${mark}</svg>`;
    document.getElementById("favicon").href = "data:image/svg+xml," + encodeURIComponent(svg);
  }
  favicon();

  const escape = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

  function ago(iso) {
    const s = (Date.now() - new Date(iso)) / 1000;
    for (const [unit, size] of [["y", 31536000], ["mo", 2592000], ["d", 86400], ["h", 3600], ["m", 60]]) {
      if (s >= size) return `${Math.floor(s / size)}${unit} ago`;
    }
    return "just now";
  }

  function side(pr, decided) {
    const parts = [];
    if (pr.pendingComments !== null) parts.push(`<span class="badge">${pr.pendingComments} pending comment${pr.pendingComments === 1 ? "" : "s"}</span>`);
    if (pr.reviewDecision === "APPROVED" && !decided) parts.push('<span class="label approved">Approved</span>');
    if (pr.reviewDecision === "CHANGES_REQUESTED") parts.push('<span class="label changes">Changes requested</span>');
    parts.push(`<span><span class="add">+${pr.additions}</span> <span class="del">−${pr.deletions}</span></span>`);
    if (pr.checks) parts.push(`<span class="dot ${pr.checks}" title="Checks: ${pr.checks.toLowerCase()}"></span>`);
    return parts.join("");
  }

  let query = "";
  const cursors = PAGES.map(() => 0);
  let list = [];

  const matches = (pr) => [pr.title, `${pr.repo}#${pr.number}`, pr.author].some((field) => field.toLowerCase().includes(query.toLowerCase()));

  function highlight(text) {
    const at = query ? text.toLowerCase().indexOf(query.toLowerCase()) : -1;
    if (at < 0) return escape(text);
    return `${escape(text.slice(0, at))}<mark>${escape(text.slice(at, at + query.length))}</mark>${escape(text.slice(at + query.length))}`;
  }

  function rowHtml(pr, g, index, selected) {
    const href = g.link ? `${pr.url}/${g.link}` : pr.url;
    const when = pr.pendingUpdatedAt ? `review updated ${ago(pr.pendingUpdatedAt)}` : `updated ${ago(pr.updatedAt)}`;
    return `<a class="row${selected ? " selected" : ""}" data-index="${index}" href="${escape(href)}" target="_blank" rel="noopener">
      ${pr.isDraft ? DRAFT_ICON : OPEN_ICON}
      <span class="title">${highlight(pr.title)}</span>
      <span class="side">${side(pr, g.decided)}</span>
      <span class="meta">${highlight(`${pr.repo}#${pr.number}`)}${g.mine ? "" : ` · ${highlight(pr.author)}`} · ${when}</span>
    </a>`;
  }

  const shown = new Set();

  function toggle(g, page, data) {
    const { id, noun, notice } = page.optional;
    const count = data.groups[id].length;
    const kbd = `<kbd>${page.optional.key}</kbd>`;
    if (g.id === id) return `<button class="toggle" data-toggle="${id}">Hide${kbd}</button>`;
    if (g.id === notice && count && !shown.has(id)) return `<button class="toggle" data-toggle="${id}">Show ${count} ${noun}${kbd}</button>`;
    return "";
  }

  function renderKeybar(page, data) {
    const { id, key, noun } = page.optional;
    const toggle = data && data.groups[id].length ? [[[key], `${shown.has(id) ? "hide" : "show"} ${noun}`]] : [];
    const items = [
      [["j", "k"], "move"],
      [["1", "2"], "pages"],
      [["o"], "open"],
      [["f"], "files"],
      ...toggle,
      [["/"], "filter"],
      [["r"], "refresh"],
      [["?"], "all shortcuts"],
    ];
    document.querySelector("#keybar ul").innerHTML = items.map(([keys, label]) =>
      `<li>${keys.map((k) => `<kbd>${k}</kbd>`).join("")}${label}</li>`
    ).join("");
  }

  function renderTabs(data) {
    const current = pageIndex();
    document.getElementById("tabs").innerHTML = PAGES.map((page, i) =>
      `<a href="#${page.id}"${i === current ? ' aria-current="page"' : ""}><kbd>${i + 1}</kbd>${page.title}${data ? ` <span class="count">${pageCount(data, page)}</span>` : ""}</a>`
    ).join("");
    renderKeybar(PAGES[current], data);
    return PAGES[current];
  }

  function render(data) {
    const page = renderTabs(data);
    const p = pageIndex();
    const groups = (shown.has(page.optional.id) ? page.groups : defaultGroups(page))
      .map((g) => ({ g, prs: data.groups[g.id].filter(matches) }))
      .filter(({ prs }) => !query || prs.length);
    list = groups.flatMap(({ prs }) => prs);
    cursors[p] = Math.max(0, Math.min(cursors[p], list.length - 1));
    let index = 0;
    document.getElementById("groups").innerHTML = groups.length ? groups.map(({ g, prs }) => {
      const body = prs.length ? prs.map((pr) => rowHtml(pr, g, index, index++ === cursors[p])).join("") : '<div class="empty">Nothing here.</div>';
      return `<section${g.quiet ? ' class="quiet"' : ""}><h2>${g.title} <span class="count">${prs.length}</span><span class="hint">${g.hint}</span>${toggle(g, page, data)}</h2>${body}</section>`;
    }).join("") : `<section><div class="empty">No pull requests match “${escape(query)}”.</div></section>`;
  }

  function select(index) {
    if (!list.length) return;
    const p = pageIndex();
    cursors[p] = Math.max(0, Math.min(index, list.length - 1));
    const rows = document.querySelectorAll("a.row");
    rows.forEach((row, i) => row.classList.toggle("selected", i === cursors[p]));
    if (cursors[p] === 0) window.scrollTo({ top: 0 });
    else rows[cursors[p]].scrollIntoView({ block: "nearest" });
  }

  const filterInput = document.getElementById("filter");

  function filter(value) {
    query = value;
    if (filterInput.value !== value) filterInput.value = value;
    cursors.fill(0);
    window.scrollTo({ top: 0 });
    if (last) render(last);
  }

  function toggleGroup(id) {
    if (!shown.delete(id)) shown.add(id);
    if (last) render(last);
  }

  const KEYS = [
    [["j", "k"], "move down / up"],
    [["↓", "↑"], "move down / up"],
    [["g", "G"], "jump to top / bottom"],
    [["1", "2"], "reviewing / your pull requests"],
    [["o", "enter"], "open pull request"],
    [["f"], "open files changed"],
    [["a"], "show / hide PRs you've approved"],
    [["d"], "show / hide your draft PRs"],
    [["/"], "filter by title, repo, #number or author"],
    [["esc"], "clear filter"],
    [["r"], "refresh"],
    [["?"], "toggle this help"],
  ];
  document.getElementById("keys").innerHTML = KEYS.map(([keys, label]) =>
    `<dt>${keys.map((k) => `<kbd>${escape(k)}</kbd>`).join(" / ")}</dt><dd>${label}</dd>`
  ).join("");

  function skeleton() {
    const page = renderTabs(null);
    let line = 0;
    document.getElementById("groups").innerHTML = defaultGroups(page).map((g, i) => {
      const rows = Array.from({ length: [2, 1, 2, 1][i % 4] }, (_, r) => {
        const seed = (i * 7 + r * 13) % 10;
        const delay = `--delay:${(line++) * 0.08}s`;
        return `<div class="skeleton">
          <span class="bone dot" style="${delay}"></span>
          <span class="bone" style="${delay};width:${45 + seed * 3}%"></span>
          <span class="bone meta" style="${delay};width:${25 + seed * 2}%"></span>
        </div>`;
      }).join("");
      return `<section aria-hidden="true"><h2>${g.title}<span class="hint">${g.hint}</span></h2>${rows}</section>`;
    }).join("");
  }

  let last = null;
  let lastFetch = 0;
  let inFlight = false;
  const status = document.getElementById("status");
  const button = document.getElementById("refresh");

  function showStatus() {
    if (inFlight) status.innerHTML = `<span class="spinner"></span>${last ? `Refreshing (last ${ago(last.fetchedAt)})` : "Loading"}`;
    else if (last) status.textContent = `${last.login} · ${last.owners.join(", ")} · ${ago(last.fetchedAt)}`;
    else status.textContent = "";
  }

  async function load() {
    if (inFlight) return;
    inFlight = true;
    button.disabled = true;
    showStatus();
    try {
      const response = await fetch("/api/inbox");
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || response.statusText);
      last = data;
      lastFetch = Date.now();
      render(data);
      document.getElementById("error").innerHTML = "";
    } catch (error) {
      document.getElementById("error").innerHTML = `<div class="error">${escape(error.message)}</div>`;
      if (!last) document.getElementById("groups").innerHTML = "";
    } finally {
      inFlight = false;
      button.disabled = false;
      showStatus();
    }
  }

  button.addEventListener("click", load);
  window.addEventListener("hashchange", () => last ? render(last) : skeleton());
  const help = document.getElementById("help");
  document.getElementById("shortcuts").addEventListener("click", () => help.showModal());
  help.addEventListener("click", (event) => { if (event.target === help) help.close(); });

  filterInput.addEventListener("input", () => filter(filterInput.value));
  filterInput.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      filter("");
      filterInput.blur();
    }
    else if (event.key === "Enter") filterInput.blur();
  });

  const open = (url) => window.open(url, "_blank", "noopener");

  document.addEventListener("keydown", (event) => {
    if (event.metaKey || event.ctrlKey || event.altKey || event.target.closest("input, textarea")) return;
    const { key } = event;
    if (help.open) {
      if (key === "?" || key === "q") help.close();
      else return;
      event.preventDefault();
      return;
    }
    const p = pageIndex();
    const current = list[cursors[p]];
    if (key === "?") help.showModal();
    else if (key === "Escape") filter("");
    else if (key === "/") filterInput.focus();
    else if (key === "j" || key === "ArrowDown") select(cursors[p] + 1);
    else if (key === "k" || key === "ArrowUp") select(cursors[p] - 1);
    else if (key === "G" || (key === "g" && event.shiftKey)) select(list.length - 1);
    else if (key === "g") select(0);
    else if (key === "r") load();
    else if (PAGES[Number(key) - 1]) location.hash = PAGES[Number(key) - 1].id;
    else if (key === PAGES[p].optional.key) toggleGroup(PAGES[p].optional.id);
    else if (key === "Enter" && event.target.closest("a, button")) return;
    else if ((key === "o" || key === "Enter") && current) open(current.url);
    else if (key === "f" && current) open(`${current.url}/files`);
    else return;
    event.preventDefault();
  });
  document.getElementById("groups").addEventListener("click", (event) => {
    const row = event.target.closest("a.row");
    if (row) return select(Number(row.dataset.index));
    const button = event.target.closest("[data-toggle]");
    if (button) toggleGroup(button.dataset.toggle);
  });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && Date.now() - lastFetch > 30000) load();
  });
  setInterval(showStatus, 30000);
  skeleton();
  load();
</script>
</body>
</html>
